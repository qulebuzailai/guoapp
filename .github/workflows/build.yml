name: iOS unsigned IPA build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ios-ipa.yml

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
            dart_define: 'false'
          - edition: zhenguojian
            arguments: '--all-sources'
            dart_define: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: 0. 环境自检
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          go version
          python3 --version
          flutter --version | head -n 2

      - name: 1. 预下载 Go 模块（带重试）
        run: |
          set -euo pipefail
          cd native
          for i in 1 2 3; do
            if go mod download; then echo "go mod download OK (第 $i 次)"; exit 0; fi
            echo "第 $i 次失败，15 秒后重试"; sleep 15
          done
          echo "go mod download 连续失败" >&2; exit 1

      - name: 2. 安装 CocoaPods
        run: brew list cocoapods --versions || brew install cocoapods

      - name: 3. 拉取 Dart 依赖（普通 pub get，带重试）
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if flutter pub get; then echo "pub get OK (第 $i 次)"; exit 0; fi
            echo "第 $i 次失败，20 秒后重试"; sleep 20
          done
          echo "pub get 连续失败" >&2; exit 1

      - name: 4. 预装 iOS Pods（带重试）
        run: |
          set -euo pipefail
          cd ios
          for i in 1 2 3; do
            if pod install --repo-update; then echo "pod install OK (第 $i 次)"; exit 0; fi
            echo "第 $i 次失败，30 秒后重试"; sleep 30
          done
          echo "pod install 连续失败" >&2; exit 1

      - name: 5a. 编译 iOS 原生核心（xcframework，走官方脚本）
        run: |
          set -euo pipefail
          python3 -u scripts/build_ios.py --core-only ${{ matrix.arguments }} \
            2>&1 | tee "/tmp/ios-build-${{ matrix.edition }}.log"

      - name: 5b. Flutter 构建 + 打包未签名 IPA（绕开脚本内 enforce-lockfile）
        run: |
          set -euo pipefail
          log="/tmp/ios-build-${{ matrix.edition }}.log"
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          slug="${{ matrix.edition }}"
          {
            echo "===== flutter build ios (ALL_SOURCES=${{ matrix.dart_define }}) ====="
            flutter build ios --release --no-codesign --no-pub \
              --dart-define=ALL_SOURCES=${{ matrix.dart_define }}
            app="build/ios/iphoneos/Runner.app"
            echo "===== FFI 符号校验 ====="
            xcrun nm -gU "$app/Runner" | grep -E '_DuanjuRequest|_DuanjuFree' \
              || { echo "iOS 包缺少 FFI 入口" >&2; exit 1; }
            echo "===== 打包 app.zip + unsigned ipa ====="
            mkdir -p dist/ios
            ditto -c -k --sequesterRsrc --keepParent "$app" \
              "dist/ios/${slug}-${version}-ios-unsigned-app.zip"
            rm -rf Payload && mkdir -p Payload
            cp -a "$app" Payload/
            ditto -c -k --sequesterRsrc Payload \
              "dist/ios/${slug}-${version}-ios-unsigned.ipa"
            rm -rf Payload
            echo "===== 校验和 ====="
            cd dist/ios
            shasum -a 256 "${slug}-${version}-ios-unsigned.ipa" \
              "${slug}-${version}-ios-unsigned-app.zip" | tee SHA256SUMS.txt
            ls -la
          } 2>&1 | tee -a "$log"

      - name: 失败时把报错尾部写入 Summary（运行页面直接可见）
        if: failure()
        run: |
          log="/tmp/ios-build-${{ matrix.edition }}.log"
          {
            echo "## ${{ matrix.edition }} 构建失败 — 步骤 5a/5b 日志最后 150 行"
            echo '```text'
            if [ -f "$log" ]; then tail -n 150 "$log"; else echo "步骤 5a 之前就已失败，请看左侧红叉步骤名"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: 6. 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-build-log
          path: /tmp/ios-build-*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 7. 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-ios
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: ios
    if: always() && needs.ios.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-ios'
          path: artifacts
          merge-multiple: true
      - name: 发布未签名 IPA 到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          tag="ios-v${version//+/-}"
          mkdir -p rl
          cp artifacts/*.ipa rl/
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" rl/*.ipa --clobber
          else
            printf '%s\n' "未签名 IPA，需用 AltStore / Sideloadly / TrollStore 等工具自签后安装。" "" "红果鉴（仅红果站源）与真果鉴（全部站源）两个版本。" > notes.md
            gh release create "$tag" rl/*.ipa --title "iOS 未签名 IPA ${version}" --notes-file notes.md
          fi
