name: iOS unsigned IPA build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ios-ipa.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Ensure CocoaPods
        run: brew list cocoapods --versions || brew install cocoapods
      - name: Build unsigned iOS packages
        run: python3 scripts/build_ios.py ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-ios
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: ios
    if: always() && needs.ios.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-ios'
          path: artifacts
      - name: 发布未签名 IPA 到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          tag="ios-v${version//+/-}"
          mkdir -p rl
          cp artifacts/*/*.ipa rl/
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" rl/*.ipa --clobber
            gh release edit "$tag" --title "iOS 未签名 IPA ${version}"
          else
            printf '%s\n' "未签名 IPA，需用 AltStore / Sideloadly / TrollStore 等工具自签后安装。" "" "红果鉴（仅红果站源）与真果鉴（全部站源）两个版本，功能相同，按需选择。" > notes.md
            gh release create "$tag" rl/*.ipa --title "iOS 未签名 IPA ${version}" --notes-file notes.md
          fi
